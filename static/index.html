<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LookFind V0.5</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090a;color:#f7f7f5;font-family:Inter,system-ui,-apple-system,sans-serif}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 6vw;border-bottom:1px solid #242426}.logo{font-weight:900;letter-spacing:3px}.tag{font-size:12px;color:#b9ff66;border:1px solid #30451f;padding:8px 12px;border-radius:99px}.hero{max-width:820px;margin:60px auto;padding:0 24px;text-align:center}.pill,.eyebrow{font-size:11px;letter-spacing:2px;color:#b9ff66;font-weight:800}.hero h1{font-size:clamp(44px,8vw,78px);line-height:.96;margin:18px 0}.hero h1 em{font-style:normal;color:#b9ff66}.hero p{max-width:650px;margin:24px auto;color:#aaa;line-height:1.6}.upload{min-height:220px;border:1px dashed #555;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;background:#111113}.upload:hover{border-color:#b9ff66}.upload input{display:none}.upload span{font-size:42px;color:#b9ff66}.upload small{color:#777}.preview{margin-top:20px;background:#111;border-radius:24px;padding:14px}.preview img{width:100%;max-height:520px;object-fit:contain;border-radius:16px}.primary{width:100%;border:0;border-radius:14px;padding:16px;background:#b9ff66;color:#101010;font-weight:900;font-size:16px;margin-top:12px;cursor:pointer}.primary:disabled{opacity:.6}.hidden{display:none!important}.results{max-width:1180px;margin:70px auto;padding:0 24px}.sectionHead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}.sectionHead h2{font-size:38px;margin:7px 0}.sectionHead p{color:#888}.score{border:1px solid #333;padding:13px 18px;border-radius:16px;text-align:center;font-size:20px;white-space:nowrap}.score small{color:#888;font-size:11px}.group{margin:38px 0}.groupTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.groupTitle h3{font-size:26px;margin:0}.confidence{color:#b9ff66;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#151517;border:1px solid #29292b;border-radius:20px;overflow:hidden}.photo{height:220px;background:#202024;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:15px}.info h4{font-size:16px;margin:6px 0;min-height:40px}.info p{margin:5px 0;color:#888;font-size:13px}.info strong{display:block;margin-top:12px;font-size:19px}.go{display:block;margin-top:12px;color:#b9ff66;font-weight:800;text-decoration:none}.cart{margin-top:48px;background:#151517;border:1px solid #303033;border-radius:24px;padding:24px}.cartTop{display:flex;justify-content:space-between;align-items:end;gap:20px}.cart h2{font-size:34px;margin:7px 0}.cartList{display:grid;gap:8px;margin:20px 0}.cartRow{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:12px;background:#101012;border-radius:14px}.cartRow b{color:#b9ff66}.cartRow a{color:#eee;text-decoration:none}.total{text-align:right}.total strong{font-size:30px;display:block}.notice{color:#777;font-size:12px;margin-top:12px}footer{text-align:center;color:#555;padding:50px}.cartChoices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:48px}.cartChoice{background:#151517;border:1px solid #303033;border-radius:24px;padding:24px}.cartChoice h2{font-size:28px;margin:7px 0}.cartChoice .cartList{margin-bottom:14px}.platformBadge{display:inline-block;color:#b9ff66;border:1px solid #3a5225;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.emptyCart{color:#888;line-height:1.5}.savings{color:#b9ff66;font-size:13px;font-weight:700;margin-top:8px}@media(max-width:850px){.cartChoices{grid-template-columns:1fr}}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.cartTop{display:block}.total{text-align:left;margin-top:16px}}@media(max-width:500px){header{padding:0 18px}.hero{margin-top:40px}.hero h1{font-size:48px}.grid{grid-template-columns:1fr}.sectionHead{align-items:center}.sectionHead h2{font-size:30px}.cartRow{grid-template-columns:85px 1fr}.cartRow span{grid-column:2}.photo{height:260px}}
</style></head><body><header><div class="logo">LOOKFIND</div><div class="tag">V0.5 • SMART CART</div></header><main><section class="hero"><span class="pill">AI FASHION SEARCH</span><h1>Fotoğrafı yükle.<br><em>Kombini bul.</em></h1><p>LookFind üst, dış giyim, alt, elbise ve ayakkabıyı ayrı ayrı tespit eder; her parçayı internette arar ve kombin sepetini oluşturur.</p><label class="upload"><input id="file" type="file" accept="image/*" capture="environment"><span>＋</span><b>Fotoğraf çek veya yükle</b><small>JPG, PNG, WebP • Maks. 15 MB</small></label><div id="previewWrap" class="preview hidden"><img id="preview"><button id="analyze" class="primary">Kombini Bul ✦</button></div></section><section id="results" class="results hidden"><div class="sectionHead"><div><span class="eyebrow">AI ANALİZİ</span><h2 id="resultTitle">Kombin bulundu.</h2><p id="resultNote"></p></div><div class="score">LIVE<br><small>AI + Lens</small></div></div><div id="groups"></div><div id="cartChoices" class="cartChoices hidden"></div></section></main><footer>LookFind • AI destekli moda keşfi</footer><script>
const $=s=>document.querySelector(s), file=$('#file'), preview=$('#preview'), wrap=$('#previewWrap'), analyze=$('#analyze'), results=$('#results'), groups=$('#groups'), cartChoices=$('#cartChoices');
file.onchange=()=>{const f=file.files[0];if(!f)return;preview.src=URL.createObjectURL(f);wrap.classList.remove('hidden');results.classList.add('hidden')};
const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function productCard(p){const img=p.thumbnail?`<img src="${esc(p.thumbnail)}" alt="">`:'👕';return `<article class="card"><div class="photo">${img}</div><div class="info"><p>${p.exact?'Birebir eşleşme':'Görsel eşleşme'}</p><h4>${esc(p.title)}</h4><p>${esc(p.source)}</p><strong>${esc(p.price||'Fiyat bilgisi yok')}</strong><a class="go" href="${esc(p.link)}" target="_blank" rel="noopener">Ürüne Git →</a></div></article>`}
function money(v){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(v||0)}
function cartRows(items){return items.map(x=>`<div class="cartRow"><b>${esc(x.category)}</b><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a><span>${esc(x.price||'Fiyat yok')}</span></div>`).join('')}
function render(data){
 $('#resultTitle').textContent=`${data.detected_count} kıyafet parçası tespit edildi.`;
 $('#resultNote').textContent='Her parça ayrı ayrı Google Lens ile arandı; sepetler bulunan sonuçlardan hesaplandı.';
 groups.innerHTML=data.groups.map(g=>`<section class="group"><div class="groupTitle"><h3>${esc(g.category)}</h3></div><div class="grid">${g.products.length?g.products.slice(0,4).map(productCard).join(''):'<p style="color:#888">Bu parça için ürün bulunamadı.</p>'}</div></section>`).join('');
 const cheapest=data.cheapest_cart||[];
 const singles=data.single_platform_carts||[];
 let html='';
 if(singles.length){
   const best=singles[0];
   html+=`<section class="cartChoice"><span class="eyebrow">TEK PLATFORM SEPETİ</span><h2>${esc(best.platform)}</h2><span class="platformBadge">${best.items.length}/${data.detected_count} parça aynı mağazada</span><div class="cartList">${cartRows(best.items)}</div><div class="total"><small>Toplam</small><strong>${money(best.total_value)}</strong></div><div class="notice">Ürünleri tek tek açıp ${esc(best.platform)} sepetinize ekleyebilirsiniz. LookFind mağaza hesabınıza erişmez.</div></section>`;
 } else {
   html+=`<section class="cartChoice"><span class="eyebrow">TEK PLATFORM SEPETİ</span><h2>Ortak mağaza bulunamadı</h2><p class="emptyCart">Bu aramada tüm parçaların fiyatlı sonucu aynı mağazada çıkmadı. Aşağıdaki en ucuz sepet yine kullanılabilir.</p></section>`;
 }
 if(cheapest.length){
   html+=`<section class="cartChoice"><span class="eyebrow">EN UCUZ SEPET</span><h2>Platform fark etmez</h2><span class="platformBadge">${cheapest.length}/${data.detected_count} parça</span><div class="cartList">${cartRows(cheapest)}</div><div class="total"><small>Ürün toplamı</small><strong>${money(data.cheapest_total)}</strong></div><div class="notice">Kargo ve kampanyalar dahil değildir. Fiyatlar mağazada değişmiş olabilir.</div></section>`;
 }
 cartChoices.innerHTML=html; cartChoices.classList.toggle('hidden',!html);
 results.classList.remove('hidden');results.scrollIntoView({behavior:'smooth'})
}
analyze.onclick=async()=>{const f=file.files[0];if(!f)return;analyze.disabled=true;analyze.textContent='Kıyafetler ayrılıyor ve aranıyor…';try{const fd=new FormData();fd.append('image',f);const r=await fetch('/api/analyze',{method:'POST',body:fd});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.detail||'Analiz başarısız oldu.');render(data)}catch(e){alert(e.message)}finally{analyze.disabled=false;analyze.textContent='Kombini Bul ✦'}};
</script></body></html>
